<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TKA Journey — Study Dashboard</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #18202a;
      --muted: #6d7480;
      --line: #e7e9ef;
      --accent: #6c63ff;
      --accent2: #8b85ff;
      --ok: #1f9d6a;
      --warn: #f59e0b;
      --shadow: 0 10px 30px rgba(20, 25, 40, .07);
      --modal-bg: rgba(15, 20, 30, .45);
      --prompt-bg: #f5f5fb;
    }

    [data-theme="dark"] {
      --bg: #0f141c;
      --card: #18202a;
      --text: #f0f3f8;
      --muted: #9aa2b0;
      --line: #2a3444;
      --accent: #7c75ff;
      --accent2: #9d97ff;
      --shadow: 0 10px 30px rgba(0, 0, 0, .3);
      --modal-bg: rgba(0, 0, 0, .75);
      --prompt-bg: #121822;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      transition: background 0.2s ease, color 0.2s ease;
    }
    button, input { font: inherit; }
    .app { max-width: 1180px; margin: auto; padding: 24px; }
    
    .top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: flex-start;
      margin-bottom: 20px;
    }
    .brand h1 { margin: 0; font-size: 30px; }
    .brand p { margin: 6px 0; color: var(--muted); }
    
    .top-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .count {
      background: var(--text);
      color: var(--bg);
      padding: 14px 18px;
      border-radius: 18px;
      text-align: center;
      min-width: 145px;
    }
    .count strong { display: block; font-size: 28px; }

    .theme-toggle {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
    }

    .nav { display: flex; gap: 8px; overflow: auto; margin-bottom: 20px; padding-bottom: 4px; }
    .nav button {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    .nav button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .grid { display: grid; gap: 16px; }
    .hero { display: grid; grid-template-columns: 1.4fr .6fr; gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .today {
      background: linear-gradient(135deg, #6c63ff, #8d87ff);
      color: #fff;
      border: 0;
    }
    .today .muted { color: #ecebff; }
    .muted { color: var(--muted); }
    .small { font-size: 13px; }
    .tag {
      display: inline-flex;
      padding: 5px 9px;
      border-radius: 999px;
      background: #f0efff;
      color: #5750d8;
      font-size: 12px;
      font-weight: 700;
    }
    .today .tag { background: rgba(255,255,255,.18); color: #fff; }
    
    .btn { border: 0; border-radius: 11px; padding: 10px 14px; cursor: pointer; font-weight: 700; }
    .primary { background: var(--accent); color: #fff; }
    .light { background: var(--prompt-bg); color: var(--text); border: 1px solid var(--line); }
    .today .light { background: #fff; color: #4e48c5; border: 0; }

    .schedule-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .schedule-editor {
      background: rgba(255,255,255,0.1);
      border: 1px dashed rgba(255,255,255,0.4);
      padding: 10px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 13px;
    }
    .schedule-editor input {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      width: 100%;
      margin-top: 4px;
    }

    .subject-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .subject { cursor: pointer; transition: .15s; }
    .subject:hover { transform: translateY(-2px); }
    .subject .icon { font-size: 27px; }
    .subject h3 { margin: 8px 0 4px; font-size: 15px; }

    .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .fill { height: 100%; background: var(--accent); width: 0%; transition: .2s; }

    .schedule { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .day { border: 1px solid var(--line); border-radius: 15px; padding: 14px; background: var(--card); cursor: pointer; }
    .day.todayDay { border: 2px solid var(--accent); }
    .day b { font-size: 14px; }
    .day .focus { margin-top: 7px; font-weight: 700; }

    .section-title { display: flex; justify-content: space-between; align-items: center; margin: 28px 0 12px; }
    .section-title h2 { margin: 0; font-size: 20px; }

    .topic-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .topic { border: 1px solid var(--line); border-radius: 16px; padding: 16px; background: var(--card); }
    .topic h3 { margin: 0 0 7px; }
    .topic p { margin: 7px 0; line-height: 1.5; }
    .topic-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }

    .check { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; cursor: pointer; }
    .check input { accent-color: var(--accent); }

    .modal {
      position: fixed;
      inset: 0;
      background: var(--modal-bg);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 10;
    }
    .modal.show { display: flex; }
    .modal-box {
      background: var(--card);
      color: var(--text);
      max-width: 720px;
      width: 100%;
      max-height: 88vh;
      overflow: auto;
      border-radius: 22px;
      padding: 24px;
      border: 1px solid var(--line);
    }
    .close { float: right; border: 0; background: var(--prompt-bg); color: var(--text); border-radius: 10px; padding: 8px 11px; cursor: pointer; }

    .material { line-height: 1.7; }
    .material h3 { margin-top: 22px; }
    .prompt {
      background: var(--prompt-bg);
      border: 1px solid var(--line);
      padding: 14px;
      border-radius: 12px;
      white-space: pre-wrap;
      font-size: 13px;
      color: var(--text);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #18202a;
      color: #fff;
      padding: 11px 15px;
      border-radius: 12px;
      display: none;
      z-index: 20;
    }

    /* Practice Quiz Styles */
    .quiz-option {
      display: block;
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      margin: 6px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
    }
    .quiz-option:hover { background: var(--prompt-bg); }
    .quiz-option.correct { background: #d1fae5; border-color: #10b981; color: #065f46; }
    .quiz-option.incorrect { background: #fee2e2; border-color: #ef4444; color: #991b1b; }

    @media(max-width:850px) {
      .hero { grid-template-columns: 1fr; }
      .subject-grid { grid-template-columns: repeat(2, 1fr); }
      .schedule, .topic-grid { grid-template-columns: 1fr; }
      .top { flex-direction: column; }
      .top-right { width: 100%; justify-content: space-between; }
      .count { flex: 1; }
    }
  </style>
</head>

  </div>

      <button class="close" onclick="closeModal()">✕</button>

    </div>
  </div>

const EXAM = new Date("2026-10-26T00:00:00");
const todayISO = new Date().toISOString().slice(0,10);

const storedProgress = JSON.parse(localStorage.getItem("tkaJourneyProgress") || "{}");
const storedBlocks = localStorage.getItem("tkaStudyBlocks") || "🌅 03:30–04:20 Deep study · ☀️ 07:00–07:30 Recall · 🏫 10:10–10:22 Micro review · 🌙 21:30–22:45 Main practice";
const storedTheme = localStorage.getItem("tkaTheme") || "light";

const state = {
  page: "home",
  subject: null,
  progress: storedProgress,
  studyBlocks: storedBlocks,
  theme: storedTheme,
  editingBlocks: false
};

// Apply Initial Theme
document.documentElement.setAttribute("data-theme", state.theme);
updateThemeBtn();

function toggleTheme() {
  state.theme = state.theme === "light" ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", state.theme);
  localStorage.setItem("tkaTheme", state.theme);
  updateThemeBtn();
}

function updateThemeBtn() {
  const btn = document.getElementById("themeBtn");
  if (btn) btn.textContent = state.theme === "light" ? "🌙" : "☀️";
}

function save() {
  localStorage.setItem("tkaJourneyProgress", JSON.stringify(state.progress));
  localStorage.setItem("tkaStudyBlocks", state.studyBlocks);
}

function pct(subject) {
  const topics = DATA.subjects[subject].topics;
  const done = topics.filter((_, i) => state.progress[subject + "-" + i]).length;
  return Math.round((done / topics.length) * 100);
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(() => t.style.display = "none", 1800);
}

function daysLeft() {
  const n = Math.ceil((EXAM - new Date()) / 86400000);
  return Math.max(0, n);
}

function fmt(iso) {
  return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
}

function subjectCard(id) {
  const s = DATA.subjects[id], p = pct(id);
  return `<div class="card subject" onclick="openSubject('${id}')">
    <div class="icon">${s.icon}</div>
    <h3>${s.name}</h3>
    <div class="bar"><div class="fill" style="width:${p}%"></div></div>
    <div class="small muted">${p}% completed</div>
  </div>`;
}

function nav() {
  const items = [["home", "🏠 Home"], ...Object.keys(DATA.subjects).map(k => [k, DATA.subjects[k].icon + " " + DATA.subjects[k].name])];
  document.getElementById("nav").innerHTML = items.map(([id, label]) => 
    `<button class="${state.page === id ? 'active' : ''}" onclick="go('${id}')">${label}</button>`
  ).join("");
}

function go(page) {
  state.page = page;
  state.subject = page === "home" ? null : page;
  render();
}

function openSubject(id) {
  state.page = id;
  state.subject = id;
  render();
}

function todayPlan() {
  return DATA.plan.find(x => x.date === todayISO) || DATA.plan[0];
}

function toggleEditBlocks() {
  state.editingBlocks = !state.editingBlocks;
  render();
}

function saveBlocks() {
  const input = document.getElementById("blocksInput");
  if (input) {
    state.studyBlocks = input.value;
    save();
  }
  state.editingBlocks = false;
  render();
}

function scheduleHTML() {
  return `<div class="schedule">${DATA.plan.map(x => {
    const s = DATA.subjects[x.subject];
    return `<div class="day ${x.date === todayISO ? 'todayDay' : ''}" onclick="openSubject('${x.subject}')">
      <div><b>${fmt(x.date)}</b> <span class="tag">${x.phase}</span></div>
      <div class="focus">${s.icon}${s.name}</div>
      <div class="small muted">${x.focus}</div>
    </div>`;
  }).join("")}</div>`;
}

function home() {
  const t = todayPlan(), s = DATA.subjects[t.subject];
  const total = Math.round(Object.keys(DATA.subjects).reduce((a, k) => a + pct(k), 0) / 5);

  const blocksDisplay = state.editingBlocks
    ? `<div class="schedule-editor">
        <label>Edit daily time blocks:</label>
        <input type="text" id="blocksInput" value="${state.studyBlocks}">
        <button class="btn light" style="margin-top:8px;padding:4px 10px;font-size:12px;" onclick="saveBlocks()">Save</button>
       </div>`
    : `<p class="muted" style="cursor:pointer" title="Click to edit schedule" onclick="toggleEditBlocks()">${state.studyBlocks} ✏️</p>`;

  return `<div class="hero">
    <section class="card today">
      <span class="tag">TODAY'S MISSION · ${fmt(t.date)}</span>
      <h2 style="font-size:30px;margin:15px 0 6px">${s.icon} ${s.name}</h2>
      <p style="font-size:18px;margin:0 0 18px">${t.focus}</p>
      ${blocksDisplay}
      <button class="btn light" onclick="openSubject('${t.subject}')">START TODAY'S STUDY →</button>
    </section>
    <section class="card">
      <div class="small muted">OVERALL PROGRESS</div>
      <div style="font-size:42px;font-weight:800;margin:5px 0">${total}%</div>
      <div class="bar"><div class="fill" style="width:${total}%"></div></div>
      <div class="small muted">Complete topics to update your progress.</div>
    </section>
  </div>
  <div class="section-title"><h2>📚 Your 5 subjects</h2></div>
  <div class="subject-grid">${Object.keys(DATA.subjects).map(subjectCard).join("")}</div>
  <div class="section-title"><h2>🗓️ Your TKA roadmap</h2><span class="small muted">One main subject per day</span></div>
  ${scheduleHTML()}`;
}

function subjectPage(id) {
  const s = DATA.subjects[id], p = pct(id);
  return `<section class="card">
    <div style="display:flex;justify-content:space-between;gap:15px;align-items:flex-start">
      <div>
        <span class="tag">${s.icon} TKA SUBJECT</span>
        <h2 style="font-size:30px;margin:10px 0">${s.name}</h2>
        <p class="muted">Study the material, practice, then mark each topic complete.</p>
      </div>
      <div style="text-align:right">
        <strong style="font-size:28px">${p}%</strong>
        <div class="small muted">completed</div>
      </div>
    </div>
    <div class="bar"><div class="fill" style="width:${p}%"></div></div>
  </section>
  <div class="section-title"><h2>📖 Materi & topik</h2></div>
  <div class="topic-grid">${s.topics.map((t, i) => {
    const key = id + "-" + i, checked = !!state.progress[key];
    return `<article class="topic">
      <span class="tag">TOPIC ${i + 1}</span><h3>${t[0]}</h3>
      <p>${t[1]}</p>
      <p class="small muted"><b>Remember:</b> ${t[2]}</p>
      <div class="topic-actions">
        <button class="btn primary" onclick="openMaterial('${id}',${i})">📖 Study material</button>
        <button class="btn light" onclick="openPracticeModal('${id}',${i})">❓ Practice 5 Questions</button>
        <button class="btn light" onclick="gemini('${id}',${i})">🤖 Ask Gemini</button>
        <label class="check"><input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleTopic('${id}',${i},this.checked)"> mastered</label>
      </div>
    </article>`;
  }).join("")}</div>`;
}

function openMaterial(id, i) {
  const s = DATA.subjects[id], t = s.topics[i];
  document.getElementById("modalContent").innerHTML = `
    <span class="tag">${s.icon} ${s.name}</span>
    <h2>${t[0]}</h2>
    <div class="material">
      <p><b>Core material:</b> ${t[1]}</p>
      <h3>🎯 What to do</h3>
      <ol>
        <li>Read the concept and explain it in your own words.</li>
        <li>Write the key formula/idea without looking.</li>
        <li>Do several TKA-style questions.</li>
        <li>Record every mistake in your mistake book.</li>
      </ol>
      <h3>⭐ Key reminder</h3>
      <p>${t[2]}</p>
      <h3>🧠 Active recall</h3>
      <p>Close your notes. Ask yourself: <b>“What do I know about ${t[0]} without looking?”</b></p>
      <h3>🤖 Gemini Notebook prompt</h3>
      <div class="prompt" id="prompt">${promptFor(id, i)}</div>
      <br>
      <button class="btn primary" onclick="copyPrompt('${id}',${i})">Copy prompt</button>
    </div>`;
  document.getElementById("modal").classList.add("show");
}

function openPracticeModal(id, i) {
  const s = DATA.subjects[id], t = s.topics[i];
  document.getElementById("modalContent").innerHTML = `
    <span class="tag">${s.icon} ${s.name}</span>
    <h2>Practice: ${t[0]}</h2>
    <p class="muted">Test your understanding with these sample questions.</p>
    <div class="material">
      <div style="margin-bottom:20px;">
        <p><b>Q1: Which of the following best describes the main focus of ${t[0]}?</b></p>
        <button class="quiz-option" onclick="checkAnswer(this, true)">A) ${t[1].slice(0, 60)}...</button>
        <button class="quiz-option" onclick="checkAnswer(this, false)">B) Irrelevant conceptual background details</button>
        <button class="quiz-option" onclick="checkAnswer(this, false)">C) Unrelated random formulas</button>
      </div>
      <div style="margin-bottom:20px;">
        <p><b>Q2: What key tip should you keep in mind for this topic?</b></p>
        <button class="quiz-option" onclick="checkAnswer(this, false)">A) Ignore syllabus requirements</button>
        <button class="quiz-option" onclick="checkAnswer(this, true)">B) ${t[3]}</button>
        <button class="quiz-option" onclick="checkAnswer(this, false)">C) Rely purely on intuition without practicing</button>
      </div>
      <div class="prompt">Need 5 dynamic, personalized questions? Use the <b>Ask Gemini</b> prompt to generate interactive drills from your Notebook LM context!</div>
    </div>`;
  document.getElementById("modal").classList.add("show");
}

function checkAnswer(btn, isCorrect) {
  const parent = btn.parentElement;
  const options = parent.querySelectorAll(".quiz-option");
  options.forEach(opt => opt.disabled = true);
  if (isCorrect) {
    btn.classList.add("correct");
    showToast("Correct! 🎉");
  } else {
    btn.classList.add("incorrect");
    showToast("Try again next time! ❌");
  }
}

function promptFor(id, i) {
  const s = DATA.subjects[id], t = s.topics[i];
  return `I am preparing for TKA on 26 October 2026. My subject is ${s.name} and today's topic is ${t[0]}. Use ONLY the sources in this Gemini Notebook. Teach me this topic at SMA/TKA level in simple language. Then give me 5 TKA-style questions, wait for my answers, and explain every mistake. Do not invent information that is not supported by the notebook sources.`;
}

function copyPrompt(id, i) {
  navigator.clipboard?.writeText(promptFor(id, i));
  showToast("Gemini prompt copied ✨");
}

function gemini(id, i) {
  copyPrompt(id, i);
  window.open("https://notebooklm.google.com/", "_blank");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

function toggleTopic(id, i, val) {
  state.progress[id + "-" + i] = val;
  save();
  render();
  showToast(val ? "Topic completed ✓" : "Topic reopened");
}

function render() {
  document.getElementById("daysLeft").textContent = daysLeft();
  nav();
  document.getElementById("app").innerHTML = state.page === "home" ? home() : subjectPage(state.page);
}

render();
</script>
